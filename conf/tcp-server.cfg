-- vim:set ft=lua:
-- TuringOS TCP echo server boot configuration
--
-- Prerequisites (QEMU command line):
--   -netdev user,id=net0,hostfwd=tcp::5555-:5000
--   -device virtio-net-device,netdev=net0
--
-- On the host, connect with:
--   python3 tools/tcp_client.py

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. io: expose virtio-net MMIO device on vbus_net
local io_buses = {
  vbus_net = l:new_channel()
}

l:start({
  caps = {
    vbus_net = io_buses.vbus_net:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io",  "red"    },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-net.io")

-- 2. tcp_server: virtio-mmio driver + lwIP + echo server on port 5000
l:start({
  caps = {
    vbus   = io_buses.vbus_net,
    sigma0 = L4.Env.sigma0,
  },
  log      = { "tcp", "green"  },
  l4re_dbg = L4.Dbg.Warn,
  -- Static IP configuration: matches QEMU slirp user network (10.0.2.x)
  -- Change to "dhcp" if you prefer DHCP (QEMU slirp supports it too)
  env = {
    IFCONFIG_IP4_vn0 = "10.0.2.15/24 via 10.0.2.2",
  },
}, "rom/tcp_server")
