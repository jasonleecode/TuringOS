-- Serial console on Raspberry Pi 4. Board drivers can be added here.
local L4 = require("L4")
local auth = L4.default_loader:new_channel()
L4.default_loader:start({ caps = { svr = auth:svr() } }, "rom/authd --rom-credentials")
L4.default_loader:start({ caps = { authd = auth }, log = L4.Env.log }, "rom/native_shell")
