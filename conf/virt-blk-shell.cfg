-- vim:set ft=lua:
-- TuringOS Phase 3b: virtio-block-driver + ext4fs (Namespace server) + native_shell
--
-- Boot order:
--   io (virt-blk.io) → virtio-block-driver → ext4fs (namespace server)
--                                           ↓
--                               native_shell (gets "ext4" cap)
--
-- native_shell can then do:  cat /ext4/hello.txt

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. io server: exposes VirtIO MMIO block device on vbus_blk
local io_buses = {
  vbus_blk = l:new_channel()
}

l:start({
  caps = {
    vbus_blk = io_buses.vbus_blk:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io",  "red"    },
  l4re_dbg = L4.Dbg.Info,
}, "rom/io rom/virt-blk.io -vvv")

-- 2. virtio-block-driver: probes virtio,mmio, exposes factory on blk_ch
local blk_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_blk,
    svr  = blk_ch:svr(),
  },
  log      = { "blk", "green"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/virtio-block-driver -v -v")

-- 3. ext4fs server: mounts the disk, runs self-test (creates /hello.txt),
--    then registers as a Namespace server on ext4_ch.
local ext4_ch = l:new_channel()

l:start({
  caps = {
    blk = blk_ch:create(0, "device=virtio-blk0"),
    svr = ext4_ch:svr(),
  },
  log      = { "ext4", "cyan"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/ext4fs")

-- 4. native_shell: receives "ext4" cap pointing to the ext4fs namespace.
--    Usage example:  cat /ext4/hello.txt
l:start({
  caps = {
    ext4 = ext4_ch,
  },
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell")
