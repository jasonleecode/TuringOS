-- vim:set ft=lua:
-- WAMR (WebAssembly Micro Runtime) verification
--
-- Runs wamr-example which embeds a WASM module inline (no filesystem needed),
-- instantiates it, calls add(40, 2), and prints the result.
-- Expected output: "wamr-example: add(40, 2) = 42"

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

l:start({
  log      = { "wamr", "yellow" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/wamr-example")
