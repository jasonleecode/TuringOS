-- vim:set ft=lua:
-- LVGL demo — fb-drv (Goos server) + virtio-input (pointer + keypad)
-- Start QEMU with: ./run_qemu_virt.sh --cfg lvgl-demo
--
-- Boot order:
--   io (virt-full.io) ─→ vbus_input ─┐
--   fb-drv (ramfb)    ─→ fb cap      ├─→ lvgl-demo
--                                     ┘

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

local vesa = L4.Env.vesa
if not vesa then
  print("[lvgl-demo.cfg] ERROR: no 'vesa' cap — start QEMU with --gpu")
  return
end

-- 1. io: expose virtio-input devices as vbus_input (keyboard + tablet)
local io_buses = {
  vbus_input = l:new_channel(),
}

l:start({
  caps = {
    vbus_input = io_buses.vbus_input:svr(),
    icu        = L4.Env.icu,
    sigma0     = L4.Env.sigma0,
  },
  log      = { "io",   "red"   },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-full.io")

-- 2. fb-drv: serves the ramfb framebuffer as a Goos IPC channel
local fb_ch = l:new_channel()

l:start({
  caps = { vesa = vesa, fb = fb_ch:svr() },
  log  = { "fb-drv", "blue" },
}, "rom/fb-drv")

-- 3. lvgl-demo: display via fb cap, input via vbus_input
l:start({
  caps = {
    fb    = fb_ch:m("rws"),
    input = io_buses.vbus_input,
  },
  log  = { "lvgl", "green" },
}, "rom/lvgl-demo")
