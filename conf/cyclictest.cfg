-- vim:set ft=lua:
-- cyclictest: scheduling latency benchmark
-- Start QEMU with: ./run_qemu_virt.sh --cfg cyclictest

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

l:start({
  log      = { "cyclictest", "green" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/cyclictest -i 1000 -l 1000 -t 8 -p 10")
