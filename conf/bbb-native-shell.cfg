-- vim:set ft=lua:
-- TuringOS native_shell for BeagleBone Black (AM335x)
-- Hardware UART is used directly, no virtual bus needed

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. Start native_shell directly (UART, GPIO, I2C are physical devices)
l:start({
  caps = {
    sigma0 = L4.Env.sigma0,
  },
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell")