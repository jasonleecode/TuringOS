-- vim:set ft=lua:
-- TuringOS native_shell for BeagleBone Black (AM335x)
-- Boot order: io (GPIO1, I2C1 vbus) -> rtc server -> native_shell

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. Start io server with BBB hardware config
--    Exposes: vbus_hw (GPIO1 + I2C1), vbus_rtc (AM335x RTC)
local io_buses = {
  vbus_hw  = l:new_channel(),
  vbus_rtc = l:new_channel(),
}

l:start({
  caps = {
    vbus_hw  = io_buses.vbus_hw:svr(),
    vbus_rtc = io_buses.vbus_rtc:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io", "red" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/bbb-hw.io")

-- 2. Start RTC server: probes AM335x RTC, announces "rtc" capability
local rtc_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_rtc,
    rtc  = rtc_ch:svr(),
  },
  log      = { "rtc", "yellow" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/rtc")

-- 3. Start native_shell with access to GPIO/I2C hardware and RTC
l:start({
  caps = {
    vbus_hw = io_buses.vbus_hw,
    rtc     = rtc_ch,
    sigma0  = L4.Env.sigma0,
  },
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell", { TZ = "CST-8" })
