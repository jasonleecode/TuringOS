-- vim:set ft=lua:
-- GPU/framebuffer debug configuration for QEMU virt + ramfb
--
-- QEMU launch prerequisite:
--   ./run_qemu_virt.sh --gpu [--vnc [PORT]]
--
-- MOE registers the ramfb as "vesa" Goos capability; ned must
-- explicitly pass it to child tasks via the caps table.

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

local vesa = L4.Env.vesa
if not vesa then
  print("[fb-test.cfg] ERROR: no 'vesa' cap — start QEMU with -device ramfb")
  return
end

l:start({
  log      = { "fb-test", "green" },
  l4re_dbg = L4.Dbg.Warn,
  caps     = { vesa = vesa },
}, "rom/fb-test")
