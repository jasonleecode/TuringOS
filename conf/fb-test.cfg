-- vim:set ft=lua:
-- GPU/framebuffer debug configuration for QEMU virt + ramfb
--
-- QEMU launch prerequisite:
--   ./run_qemu_virt.sh --gpu [--vnc [PORT]]
--
-- Bootstrap auto-detects the QEMU ramfb via fw_cfg and registers it as
-- the "vesa" Goos capability in MOE's namespace.

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- fb-test: accesses the "vesa" capability from the global namespace
-- (no explicit cap passing needed; Env_ns resolves it automatically)
l:start({
  log      = { "fb-test", "green" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/fb-test")
