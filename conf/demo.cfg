-- vim:set ft=lua:
-- TuringOS Demo Configuration
-- This keeps the system running with demo programs

local L4 = require("L4");

io.write("\n");
io.write("========================================\n");
io.write("  TuringOS Demo System\n");
io.write("========================================\n\n");

io.write("Microkernel: Fiasco\n");
io.write("Runtime:     L4Re\n");
io.write("Platform:    QEMU ARM Virt (Cortex-A15)\n\n");

-- 启动 hello 程序
io.write("Starting demo program...\n\n");
L4.default_loader:start({}, "rom/hello");

io.write("\n========================================\n");
io.write("System is running. Press Ctrl-A X to exit QEMU.\n");
io.write("========================================\n\n");

-- 保持系统运行
-- 在实际的交互式系统中，这里会是 shell loop
while true do
  -- 每10秒打印一次心跳信息
  L4.sleep(10000);
  io.write("[System heartbeat - " .. os.date("%H:%M:%S") .. "]\n");
end
