-- vim:set ft=lua:
-- TuringOS Demo Configuration
-- Simple Demo that starts native_shell

io.write("\n========================================");
io.write("  TuringOS Demo System\n");
io.write("========================================\n\n");

io.write("Starting native_shell...\n");

-- native_shell is compiled as a C program, not loaded via require()
-- It should be started as the roottask via modules.list configuration

-- Keep the system running
while true do
  -- Every 10 seconds print a heartbeat message
  -- Note: os.date and sleep may not be available without L4 module
  local i = 0
  while i < 100000000 do
    i = i + 1
  end
  io.write("[System heartbeat] Waiting...\n");
end
