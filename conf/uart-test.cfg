-- vim:set ft=lua:
-- uart-test: virtio-serial Vcon server + client test
--
-- Architecture:
--   io (virt-serial.io) → vbus_serial (virtio-mmio-bus.2)
--         ↓
--   virtio-serial server  →  exposes L4::Vcon IPC as "vcon"
--         ↓
--   uart-test client      →  uses only l4_vcon_write / l4_vcon_read
--
-- QEMU: run with  --cfg uart-test --uart

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. io: expose SLOT2 (virtio-serial, MMIO 0xa000400) as vbus_serial
local io_buses = {
  vbus_serial = l:new_channel(),
}

l:start({
  caps = {
    vbus_serial = io_buses.vbus_serial:svr(),
    icu         = L4.Env.icu,
    sigma0      = L4.Env.sigma0,
  },
  log      = { "io",      "red"    },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-serial.io")

-- 2. virtio-serial server: drives virtio hardware, offers L4::Vcon endpoint
local vcon_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_serial,  -- hardware access
    vcon = vcon_ch:svr(),         -- server-side vcon cap
  },
  log      = { "vserial", "cyan"   },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/virtio-serial")

-- 3. uart-test: pure Vcon client, no hardware knowledge
l:start({
  caps = {
    vcon = vcon_ch,               -- client-side vcon cap
  },
  log      = { "uart-test", "green"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/uart-test")
