-- vim:set ft=lua:
-- TuringOS native_shell for i.MX6UL
-- Minimal boot: native_shell only (no RTC, no disk, no network for first iteration)

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

l:start({
  caps     = {},
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell")
