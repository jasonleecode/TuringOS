-- vim:set ft=lua:
-- TuringOS native_shell for i.MX6UL
-- Diskless development boot: authd and native_shell (no RTC, no disk, no network for first iteration)

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

local authd = l:new_channel()
l:start({
  caps = { svr = authd:svr() },
  log = { "authd", "yellow" },
}, "rom/authd --diskless-development")

l:start({
  caps     = { authd = authd },
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell", { TZ = "CST-8" })
