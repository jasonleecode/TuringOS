-- vim:set ft=lua:
-- Simple test configuration

io.write("\n========================================\n");
io.write("  TuringOS L4Re Test Environment\n");
io.write("========================================\n\n");

-- Try to load L4 module if available
local status, L4 = pcall(require, "L4")

if status then
  io.write("L4 module loaded successfully!\n\n");
  io.write("System Information:\n");
  io.write("  L4Re Environment detected\n");

  -- Start hello program
  io.write("\nStarting hello program...\n\n");
  L4.default_loader:start({}, "rom/hello");
else
  io.write("L4 module not available in this Lua build\n");
  io.write("Error: " .. tostring(L4) .. "\n");
  io.write("\nThis appears to be standard Lua, not L4Re Lua (ned)\n");
end
