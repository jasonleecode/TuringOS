-- vim:set ft=lua:
-- smp-spawn-bench: SMP scheduler stress test
-- Exercises Switch_lock::schedule() path; requires SMP (run with -smp 2).
-- Start QEMU with: ./run_qemu_virt.sh --cfg smp-spawn-bench
--
-- The benchmark combines cross-CPU IPC ping-pong with repeated spawnd
-- child spawning to stress the preemption_point() window in schedule().

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- spawnd: program loader (needed for spawn stress)
local spawnd_ch = l:new_channel()
l:start({
  caps = { svr = spawnd_ch:svr() },
  log  = { "spawnd", "white" },
}, "rom/spawnd")

-- smp-spawn-bench: stress test with spawnd cap
l:start({
  caps     = { spawnd = spawnd_ch },
  log      = { "bench", "cyan" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/smp-spawn-bench -D 30 -s 2")
