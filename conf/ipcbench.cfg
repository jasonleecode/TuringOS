-- vim:set ft=lua:
-- ipcbench: IPC performance benchmark
-- Start QEMU with: ./run_qemu_virt.sh --cfg ipcbench

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

l:start({
  log      = { "ipcbench", "cyan" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/ipcbench -m lat -i 10000")
