-- vim:set ft=lua:
-- TuringOS native_shell
-- Boot order: io (vbus for pl031) -> rtc server -> native_shell
-- 版本 2: 支持预加载程序文件以支持 shell-exec 功能

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. Start io server: discovers hardware from DTB, exposes pl031 vbus
local io_buses = {
  vbus_rtc = l:new_channel()
}

l:start({
  caps = {
    vbus_rtc = io_buses.vbus_rtc:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io",  "red"    },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-rtc.io")

-- 2. Start RTC server: probes pl031, announces "rtc" capability
local rtc_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_rtc,
    rtc  = rtc_ch:svr(),
  },
  log      = { "rtc", "yellow" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/rtc")

-- 3. Preload common programs for shell-exec support
-- 这些程序将作为 capability 传递给 native_shell
local programs = {
  "hello",
  "fb-test",
  -- "tcp_server",  -- 如果需要的话
}

-- 建立程序文件的 capability 通道
local programs_ch = l:new_channel()

-- 这里我们使用一个简单的方法：通过 ned 的 start 机制传递
-- 实际上 ned 会将模块加载到 ROM，我们可以通过 namespace 访问
-- 暂时先传递一个空的 ns，native_shell 内部会初始化

-- 4. Start native_shell: pass ned's own uart vcon so readline gets stdin,
--    rtc for CLOCK_REALTIME, sigma0 for virtio-net MMIO mapping (net cmd),
--    and programs library for shell-exec support.
l:start({
  caps = {
    rtc           = rtc_ch,
    sigma0        = L4.Env.sigma0,
    -- programs     = programs_ch:svr(),  -- 暂时注释，等待完善实现
  },
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell")