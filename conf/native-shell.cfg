-- vim:set ft=lua:
-- TuringOS native_shell
-- Boot order: io (vbus for pl031) -> rtc server -> native_shell

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. Start io server: discovers hardware from DTB, exposes pl031 vbus
local io_buses = {
  vbus_rtc = l:new_channel()
}

l:start({
  caps = {
    vbus_rtc = io_buses.vbus_rtc:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io",  "red"    },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-rtc.io")

-- 2. Start RTC server: probes pl031, announces "rtc" capability
local rtc_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_rtc,
    rtc  = rtc_ch:svr(),
  },
  log      = { "rtc", "yellow" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/rtc")

-- 3. Start native_shell: pass ned's own uart vcon so readline gets stdin,
--    and libc_be_rtc picks up "rtc" for CLOCK_REALTIME.
l:start({
  caps = {
    rtc = rtc_ch,
  },
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell")
