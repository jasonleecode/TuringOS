-- vim:set ft=lua:
-- TuringOS native_shell — unified config
--
-- Boot order:
--   fb-drv (optional)  ─────────────────────────────────────────────┐
--   io (virt-full.io) ─┬─ rtc server       ─┐                       │
--                      └─ virtio-block-driver ─→ ext4fs ─→ syslogd ─┤
--                                                                     ↓
--                                                           native_shell
--
-- native_shell capabilities:
--   fb      → fb-drv Goos server (显示，仅 --gpu 模式可用)
--   rtc     → CLOCK_REALTIME (pl031 via rtc server)
--   sigma0  → raw MMIO access for virtio-net (network auto-init)
--   ext4    → ext4fs namespace server (/ext4 mount point)
--   syslogd → centralized log daemon (libklog IPC target)

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 0. fb-drv: 仅在 QEMU --gpu 模式下（MOE 注册了 vesa cap）启动
local fb_ch = nil
local vesa  = L4.Env.vesa
if vesa then
  fb_ch = l:new_channel()
  l:start({
    caps = { vesa = vesa, fb = fb_ch:svr() },
    log  = { "fb-drv", "blue" },
  }, "rom/fb-drv")
end

-- 1. io: expose pl031 RTC and VirtIO block device
-- vbus_input must be listed even though native_shell doesn't use it:
-- io looks up every bus from virt-full.io in its capability table and hangs
-- (waiting for a client that never comes) if the cap is absent.
local io_buses = {
  vbus_rtc   = l:new_channel(),
  vbus_blk   = l:new_channel(),
  vbus_input = l:new_channel(),
}

l:start({
  caps = {
    vbus_rtc   = io_buses.vbus_rtc:svr(),
    vbus_blk   = io_buses.vbus_blk:svr(),
    vbus_input = io_buses.vbus_input:svr(),
    icu        = L4.Env.icu,
    sigma0     = L4.Env.sigma0,
  },
  log      = { "io",   "red"    },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-full.io")

-- 2. RTC server: probes pl031, provides CLOCK_REALTIME
local rtc_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_rtc,
    rtc  = rtc_ch:svr(),
  },
  log      = { "rtc",  "yellow" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/rtc")

-- 3. virtio-block-driver: probes virtio,mmio, exposes block device factory
local blk_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_blk,
    svr  = blk_ch:svr(),
  },
  log      = { "blk",  "green"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/virtio-block-driver")

-- 4. ext4fs: mounts the disk, serves /ext4 namespace (optional — skipped if no disk)
local ext4_ch = nil
do
  local blk_cap
  local ok = pcall(function()
    blk_cap = blk_ch:create(0, "device=virtio-blk0")
  end)
  if ok and blk_cap then
    ext4_ch = l:new_channel()
    l:start({
      caps = {
        blk = blk_cap,
        svr = ext4_ch:svr(),
      },
      log      = { "ext4", "cyan"   },
      l4re_dbg = L4.Dbg.Warn,
    }, "rom/ext4fs")
  else
    print("native-shell: no block device, /ext4 disabled")
  end
end

-- 5. syslogd: centralized log daemon (only started when ext4 is available)
local syslogd_ch = nil
if ext4_ch then
  syslogd_ch = l:new_channel()
  l:start({
    caps = {
      svr  = syslogd_ch:svr(),
      ext4 = ext4_ch,
    },
    log      = { "syslogd", "magenta" },
    l4re_dbg = L4.Dbg.Warn,
  }, "rom/syslogd")
end

-- 6. native_shell
--   fb      → fb-drv Goos IPC (显示，--gpu 模式下可用)
--   rtc     → date/time via CLOCK_REALTIME
--   sigma0  → net_auto_init() maps virtio-net MMIO at startup
--   ext4    → /ext4 filesystem (cat, echo >, ls; nil if no disk)
--   syslogd → log daemon IPC (libklog routes writes here when present)
local shell_caps = {
  rtc    = rtc_ch,
  sigma0 = L4.Env.sigma0,
  input  = io_buses.vbus_input,
}
if fb_ch      then shell_caps.fb      = fb_ch      end
if ext4_ch    then shell_caps.ext4    = ext4_ch    end
if syslogd_ch then shell_caps.syslogd = syslogd_ch end

l:start({
  caps     = shell_caps,
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell")
