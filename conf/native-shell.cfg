-- vim:set ft=lua:
-- TuringOS native_shell — unified config
--
-- Boot order:
--   fb-drv (optional)  ─────────────────────────────────────────────┐
--   io (virt-full.io) ─┬─ rtc server       ─┐                       │
--                      └─ virtio-block-driver ─→ ext4fs ─→ syslogd ─┤
--                                                                     ↓
--                                                           native_shell
--
-- native_shell / spawnd capabilities:
--   fb      → fb-drv Goos server (显示，仅 --gpu 模式可用)
--   rtc     → CLOCK_REALTIME (pl031 via rtc server)
--   netd    → network server (owns the NIC via vbus + lwIP; socket-over-IPC).
--             Held by SPAWND (not the shell), which forwards it to net apps
--             like `netcat`.  The shell itself holds no network cap / no sigma0.
--   authd   → authentication server (login credential check over IPC; the
--             shell holds no password — creds live in /ext4/etc/shadow).
--   ext4    → ext4fs namespace server (/ext4 mount point)
--   syslogd → centralized log daemon (libklog IPC target)
--   input   → vbus_input (forwarded to child programs via spawnd)

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 0. fb-drv: 仅在 QEMU --gpu 模式下（MOE 注册了 vesa cap）启动
local fb_ch = nil
local vesa  = L4.Env.vesa
if vesa then
  fb_ch = l:new_channel()
  l:start({
    caps = { vesa = vesa, fb = fb_ch:svr() },
    log  = { "fb-drv", "blue" },
  }, "rom/fb-drv")
end

-- 1. io: expose pl031 RTC and VirtIO block device
-- vbus_input must be listed even though native_shell doesn't use it:
-- io looks up every bus from virt-full.io in its capability table and hangs
-- (waiting for a client that never comes) if the cap is absent.
local io_buses = {
  vbus_rtc   = l:new_channel(),
  vbus_blk   = l:new_channel(),
  vbus_net   = l:new_channel(),
  vbus_input = l:new_channel(),
  vbus_gpio  = l:new_channel(),
}

l:start({
  caps = {
    vbus_rtc   = io_buses.vbus_rtc:svr(),
    vbus_blk   = io_buses.vbus_blk:svr(),
    vbus_net   = io_buses.vbus_net:svr(),
    vbus_input = io_buses.vbus_input:svr(),
    vbus_gpio  = io_buses.vbus_gpio:svr(),
    icu        = L4.Env.icu,
    sigma0     = L4.Env.sigma0,
  },
  log      = { "io",   "red"    },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/io rom/virt-full.io")

-- 2. RTC server: probes pl031, provides CLOCK_REALTIME
local rtc_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_rtc,
    rtc  = rtc_ch:svr(),
  },
  log      = { "rtc",  "yellow" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/rtc")

-- 3. virtio-block-driver: probes virtio,mmio, exposes block device factory
local blk_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_blk,
    svr  = blk_ch:svr(),
  },
  log      = { "blk",  "green"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/virtio-block-driver")

-- 3b. netd: the network server (network-stack decomposition Phase 1).  It owns
-- the virtio-net NIC via vbus_net (SLOT0) + the whole lwIP stack, and exposes a
-- socket-over-IPC interface (Net_svr).  Crucially it gets only { vbus, svr } —
-- NO sigma0 — so the dangerous raw-physical-memory cap that native_shell used
-- to hold for networking is gone from the shell and confined to nothing (netd
-- maps the NIC through the io manager, not sigma0).
local netd_ch = l:new_channel()
l:start({
  caps = {
    vbus = io_buses.vbus_net,
    svr  = netd_ch:svr(),
  },
  log      = { "netd", "blue" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/netd")

-- 4. ext4fs: mounts the disk, serves /ext4 namespace (optional — skipped if no disk)
local ext4_ch = nil
do
  local blk_cap
  local ok = pcall(function()
    blk_cap = blk_ch:create(0, "device=virtio-blk0")
  end)
  if ok and blk_cap then
    ext4_ch = l:new_channel()
    l:start({
      caps = {
        blk = blk_cap,
        svr = ext4_ch:svr(),
      },
      log      = { "ext4", "cyan"   },
      l4re_dbg = L4.Dbg.Warn,
    }, "rom/ext4fs")
  else
    print("native-shell: no block device, /ext4 disabled")
  end
end

-- 5. syslogd: centralized log daemon (only started when ext4 is available)
local syslogd_ch = nil
if ext4_ch then
  syslogd_ch = l:new_channel()
  l:start({
    caps = {
      svr  = syslogd_ch:svr(),
      ext4 = ext4_ch,
    },
    log      = { "syslogd", "magenta" },
    l4re_dbg = L4.Dbg.Warn,
  }, "rom/syslogd")
end

-- 5b. authd: authentication server (decompose-native_shell step ②).  Owns the
-- credential store — salted SHA-256 hashes in /ext4/etc/shadow — and verifies
-- login over IPC (Auth_svr).  Gets only { svr, ext4 }: no console, no network.
-- The shell holds no password anymore; it just asks authd.  ext4 is forwarded
-- only when a disk is present (else authd uses its built-in fallback entry).
local authd_ch = l:new_channel()
do
  local authd_caps = { svr = authd_ch:svr() }
  if ext4_ch then authd_caps.ext4 = ext4_ch end
  l:start({
    caps     = authd_caps,
    log      = { "authd", "yellow" },
    l4re_dbg = L4.Dbg.Warn,
  }, "rom/authd")
end

-- 6. spawnd: program loader server (always started; ext4 is optional)
-- ROM-based programs (cyclictest, hello, lvgl-demo, …) work without ext4.
-- ext4 cap is forwarded only when a disk is present.
local spawnd_ch = l:new_channel()
local spawnd_caps = {
  svr    = spawnd_ch:svr(),
  sigma0 = L4.Env.sigma0,
  input  = io_buses.vbus_input,
}
if ext4_ch    then spawnd_caps.ext4    = ext4_ch    end
if syslogd_ch then spawnd_caps.syslogd = syslogd_ch end
if fb_ch      then spawnd_caps.fb      = fb_ch      end
-- propagate spawnd client cap so children (e.g. smp-spawn-bench) can spawn
spawnd_caps.spawnd = spawnd_ch
-- network-stack decomposition ③: spawnd forwards its initial caps (by name) to
-- every program it launches, so handing it the netd gate lets standalone net
-- apps (e.g. `run rom/netcat ...`) reach the network purely over Net_svr IPC —
-- no lwIP, no sigma0 in the app, and none needed in the shell either.
spawnd_caps.netd = netd_ch
l:start({
  caps     = spawnd_caps,
  log      = { "spawnd", "white" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/spawnd")

-- 6a. dev registry: a shared, empty, writable namespace (Moe-backed).  Drivers
-- self-register their service gate here under a device name; native_shell looks
-- them up by name (driver-framework Phase 2).  Adding a driver no longer needs
-- any per-driver cap wiring on the shell side.
local dev_ns = l:create_namespace({})

-- 6b. drvd: a dedicated, RESTRICTED spawnd instance used only to launch driver
-- servers (driver-framework Phase 3).  spawnd forwards its own initial caps to
-- the tasks it spawns, so by giving drvd only { dev, vbus } every driver it
-- launches inherits exactly that minimal set — never the shell's sigma0/ext4.
-- Cap NAMES are preserved, so the driver's get_cap("dev")/get_cap("vbus") work.
local drvd_ch = l:new_channel()
l:start({
  caps     = {
    svr    = drvd_ch:svr(),
    dev    = dev_ns:m("rws"),       -- RW: forwarded to drivers so they register
    vbus   = io_buses.vbus_gpio,    -- forwarded to drivers as "vbus" (GPIO)
    spawnd = drvd_ch,               -- spawnd convention: own cap to children
  },
  log      = { "drvd", "white" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/spawnd")

-- 6c. devmgr: decides which drivers to run and launches them via drvd; each
-- driver then self-registers in `dev`, so the shell finds it by name.  ned no
-- longer starts individual drivers — that policy lives in devmgr now.
l:start({
  caps     = { drvd = drvd_ch },
  log      = { "devmgr", "cyan" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/devmgr")

-- 7. native_shell
--   fb      → fb-drv Goos IPC (显示，--gpu 模式下可用)
--   rtc     → date/time via CLOCK_REALTIME
--   ext4    → /ext4 filesystem (cat, echo >, ls; nil if no disk)
--   syslogd → log daemon IPC (libklog routes writes here when present)
--   spawnd  → program loader server (run/jobs/kill commands)
-- The shell holds NO network cap of its own: networking moved out to netd, and
-- net apps run as separate spawned processes (e.g. `run rom/netcat`) that get
-- the netd cap forwarded through spawnd.  No sigma0, no netd in the shell.
--   authd → login credential check over IPC (the shell holds no password).
local shell_caps = {
  rtc    = rtc_ch,
  authd  = authd_ch,
  input  = io_buses.vbus_input,
}
if fb_ch      then shell_caps.fb      = fb_ch      end
if ext4_ch    then shell_caps.ext4    = ext4_ch    end
if syslogd_ch then shell_caps.syslogd = syslogd_ch end
shell_caps.spawnd = spawnd_ch
shell_caps.dev    = dev_ns:m("r")   -- device registry (read-only): temp/radio
                                    -- commands resolve drivers by name (Phase 2)

l:start({
  caps     = shell_caps,
  log      = L4.Env.log,
  l4re_dbg = L4.Dbg.Warn,
}, "rom/native_shell", { TZ = "CST-8" })
