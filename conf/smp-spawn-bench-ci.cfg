-- vim:set ft=lua:
-- smp-spawn-bench-ci: CI 专用短时长变体（见 conf/smp-spawn-bench.cfg）
-- 用于 tools/ci_smp_smoke.sh 的回归门禁：缩短单轮时长、加大 spawner 压力，
-- 让单位 wall time 内能跑更多轮、提高概率崩溃的统计样本数。
-- 唯一区别是 bench 参数：-D 8（8s 而非 30s）+ -s 3（3 个 spawner 而非 2）。

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- spawnd: program loader (needed for spawn stress)
local spawnd_ch = l:new_channel()
l:start({
  caps = { svr = spawnd_ch:svr() },
  log  = { "spawnd", "white" },
}, "rom/spawnd")

-- smp-spawn-bench: stress test with spawnd cap (CI: shorter, more spawners)
l:start({
  caps     = { spawnd = spawnd_ch },
  log      = { "bench", "cyan" },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/smp-spawn-bench -D 8 -s 3")
