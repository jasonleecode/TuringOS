-- vim:set ft=lua:
-- TuringOS virtio-block-driver
-- Boot order: io (virt-blk.io) -> virtio-block-driver

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. Start io server: exposes both VirtIO MMIO slots as vbus_blk
local io_buses = {
  vbus_blk = l:new_channel()
}

l:start({
  caps = {
    vbus_blk = io_buses.vbus_blk:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io",  "red"    },
  l4re_dbg = L4.Dbg.Info,
}, "rom/io rom/virt-blk.io -vvv")

-- 2. Start virtio-block-driver: probes virtio,mmio, announces "svr" capability
l:start({
  caps = {
    vbus = io_buses.vbus_blk,
    svr  = l:new_channel():svr(),
  },
  log      = { "blk", "green"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/virtio-block-driver -v -v")
