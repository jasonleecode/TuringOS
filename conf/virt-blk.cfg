-- vim:set ft=lua:
-- TuringOS virtio-block-driver + ext4fs server
-- Boot order: io (virt-blk.io) → virtio-block-driver → ext4fs

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

-- 1. io server: exposes both VirtIO MMIO slots as vbus_blk
local io_buses = {
  vbus_blk = l:new_channel()
}

l:start({
  caps = {
    vbus_blk = io_buses.vbus_blk:svr(),
    icu      = L4.Env.icu,
    sigma0   = L4.Env.sigma0,
  },
  log      = { "io",  "red"    },
  l4re_dbg = L4.Dbg.Info,
}, "rom/io rom/virt-blk.io -vvv")

-- 2. virtio-block-driver: probes virtio,mmio, exposes factory on blk_ch
local blk_ch = l:new_channel()

l:start({
  caps = {
    vbus = io_buses.vbus_blk,
    svr  = blk_ch:svr(),
  },
  log      = { "blk", "green"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/virtio-block-driver -v -v")

-- 3. ext4fs server: Ned creates the VirtIO device connection via block driver
--    factory (blocks until block driver is ready), then passes the resulting
--    L4virtio::Device cap directly to ext4fs as "blk".
l:start({
  caps = {
    blk = blk_ch:create(0, "device=virtio-blk0"),
  },
  log      = { "ext4", "cyan"  },
  l4re_dbg = L4.Dbg.Warn,
}, "rom/ext4fs")
