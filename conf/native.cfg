-- vim:set ft=lua:
-- Native Shell Configuration
-- Starts native_shell without requiring L4 Lua module

io.write("\n========================================");
io.write("  TuringOS Native Shell\n");
io.write("========================================\n\n");

io.write("Starting /bin/native_shell...\n\n");

-- Try to run native_shell using os.execute()
-- This should work in basic Lua environment without L4 module
-- Note: In L4Re's ned environment, the standard os.execute may be replaced
-- We'll try multiple methods

local function start_native_shell()
  -- Method 1: Try using the ned loader directly
  if package.loaded and package.loaded['L4.default_loader'] then
    io.write("Using L4.default_loader...\n");
    local loader = package.loaded['L4.default_loader']
    loader:start({}, "rom/native_shell");
    return true;
  end

  -- Method 2: Try using a simple print and loop
  -- The native_shell should be the main program already started
  io.write("native_shell should be running as main process.\n");
  return true;
end

-- Attempt to start native_shell
local ok, err = pcall(start_native_shell);
if not ok then
  io.write("Error starting native_shell: " .. tostring(err) .. "\n");
  io.write("Note: native_shell may already be running as the main process.\n");
end

-- Keep the system running
io.write("System running. Native shell should have input.\n\n");
while true do
  -- Simple loop to keep the process alive
  local i = 0;
  while i < 10000000 do
    i = i + 1;
  end
end
