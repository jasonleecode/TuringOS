-- vim:set ft=lua:
-- fb-drv launch configuration
--
-- Topology:
--   MOE "vesa" cap (ramfb) → fb-drv (Goos server) → fb-test (client)
--
-- Start QEMU with: ./run_qemu_virt.sh --gpu

local L4 = package.loaded["L4"] or require("L4")
local l   = L4.default_loader

local vesa = L4.Env.vesa
if not vesa then
  print("[fb-drv.cfg] ERROR: no 'vesa' cap — start QEMU with -device ramfb")
  return
end

-- IPC channel: fb-drv listens on server side, clients connect via client side
local fb_svr = l:new_channel()

-- Start fb-drv: gets upstream vesa + server endpoint of fb channel
l:start({
  log  = { "fb-drv", "blue" },
  caps = { vesa = vesa, fb = fb_svr:svr() },
}, "rom/fb-drv")

-- Start fb-test: gets fb-drv's client side, named "vesa" so code is unchanged
l:start({
  log  = { "fb-test", "green" },
  caps = { vesa = fb_svr:m("rws") },
}, "rom/fb-test")
